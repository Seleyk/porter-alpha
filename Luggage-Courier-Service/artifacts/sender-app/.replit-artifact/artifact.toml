kind = "mobile"
previewPath = "/"
title = "SwiftSend - Send Packages"
version = "1.0.0"
id = "artifacts/sender-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19209

[services.development]
run = "pnpm --filter @workspace/sender-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sender-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/sender-app", "run", "serve" ]

[services.env]
PORT = "19209"
BASE_PATH = "/"
